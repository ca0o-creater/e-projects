<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>嫦娥奔月 · 皮影舞台</title>
  </head>
  <body>
    <div id="viewport-size"></div>
    <section id="entrance" aria-label="进入演出">
      <button id="enter-button" type="button" disabled>进入体验</button>
      <p id="entrance-status" role="status">正在准备舞台…</p>
    </section>
    <main id="stage" aria-label="第一幕 · 后羿得药" hidden>
      <div id="handoff-ui">
        <p id="handoff-status" role="status" aria-live="polite"></p>
        <button id="assist-button" class="stage-button" type="button" hidden>辅助完成</button>
        <button id="next-button" class="stage-button" type="button" hidden>前往凡间</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
